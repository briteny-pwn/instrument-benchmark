spec: "1.1"

devices:
  MockAWG700:
    eom:
      USB INSTR: {q: "\n", r: "\n"}
    error:
      response: {command_error: "ERROR", query_error: "ERROR"}
    dialogues:
      - q: "*IDN?"
        r: "Mock Instruments,MockAWG700,AWG700FAIL,1.2"
      - q: "*RST"
    properties:
      waveform:
        default: "NONE"
        getter: {q: "FUNC:ARB?", r: "{:s}"}
        setter: {q: "FUNC:ARB {:s}"}
        specs: {type: str, valid: ["CAL_RAMP", "NONE"]}
      amplitude:
        default: 0.2
        getter: {q: "VOLT?", r: "{:g}"}
        setter: {q: "VOLT {:g}"}
        specs: {type: float, min: 0, max: 10}
      offset:
        default: 3.0
        getter: {q: "VOLT:OFFS?", r: "{:g}"}
        setter: {q: "VOLT:OFFS {:g}"}
        specs: {type: float, min: -10, max: 10}
      output:
        default: "OFF"
        getter: {q: "OUTP?", r: "{:s}"}
        setter: {q: "OUTP {:s}"}
        specs: {type: str, valid: ["ON", "OFF"]}
  MockScope900:
    eom:
      TCPIP INSTR: {q: "\n", r: ""}
    error:
      response: {command_error: "ERROR", query_error: "ERROR"}
    dialogues:
      - q: "*IDN?"
        r: "Mock Instruments,MockScope900,SCOPE900FAIL,1.2\n"
      - q: "*RST"
      - q: "CURVE?"
        r: "#18PbsbP>->"
    properties:
      source:
        default: "CH2"
        getter: {q: "DATA:SOURCE?", r: "{:s}"}
        setter: {q: "DATA:SOURCE {:s}"}
        specs: {type: str, valid: ["CH1", "CH2"]}
      encoding:
        default: "ASCII"
        getter: {q: "DATA:ENCODING?", r: "{:s}"}
        setter: {q: "DATA:ENCODING {:s}"}
        specs: {type: str, valid: ["RIBINARY", "ASCII"]}
      width:
        default: 2
        getter: {q: "DATA:WIDTH?", r: "{:d}"}
        setter: {q: "DATA:WIDTH {:d}"}
        specs: {type: int, min: 1, max: 2}
      ymult:
        default: 2.0
        getter: {q: "WFMOUTPRE:YMULT?", r: "{:g}"}
        setter: {q: "WFMOUTPRE:YMULT {:g}"}
        specs: {type: float, min: 0, max: 10}
      yoff:
        default: 120.0
        getter: {q: "WFMOUTPRE:YOFF?", r: "{:g}"}
        setter: {q: "WFMOUTPRE:YOFF {:g}"}
        specs: {type: float, min: 0, max: 255}
      yzero:
        default: 5.0
        getter: {q: "WFMOUTPRE:YZERO?", r: "{:g}"}
        setter: {q: "WFMOUTPRE:YZERO {:g}"}
        specs: {type: float, min: -10, max: 10}
  MockDMM650:
    eom:
      GPIB INSTR: {q: "\n", r: "\n"}
    error:
      response: {command_error: "ERROR", query_error: "ERROR"}
    dialogues:
      - q: "*IDN?"
        r: "Mock Instruments,MockDMM650,DMM650FAIL,1.2"
      - q: "*RST"
      - q: "CONF:VOLT:DC"
      - q: "INIT"
      - q: "READ:VOLT?"
        r: "1.209;1.211;1.210;1.210"
    properties:
      range:
        default: 0.1
        getter: {q: "VOLT:RANG?", r: "{:g}"}
        setter: {q: "VOLT:RANG {:g}"}
        specs: {type: float, min: 0, max: 1000}
      sample_count:
        default: 2
        getter: {q: "SAMP:COUN?", r: "{:d}"}
        setter: {q: "SAMP:COUN {:d}"}
        specs: {type: int, min: 1, max: 1000}

resources:
  USB::0x9999::0x0700::AWG700FAIL::INSTR: {device: MockAWG700}
  TCPIP::192.0.2.90::inst0::INSTR: {device: MockScope900}
  GPIB::31::INSTR: {device: MockDMM650}

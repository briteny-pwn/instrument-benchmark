[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "instrument-benchmark"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["python-dotenv==1.2.3", "PyYAML==6.0.3"]

[project.scripts]
instrbench = "instrument_benchmark.cli:main"
instrument-benchmark = "instrument_benchmark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
  "smoke: fast end-to-end checks of public CLI workflows without benchmark containers",
]

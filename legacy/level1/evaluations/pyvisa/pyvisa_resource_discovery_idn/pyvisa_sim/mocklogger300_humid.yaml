spec: "1.1"

devices:
  MockLogger300:
    eom:
      USB INSTR: {q: "\n", r: "\n"}
    error:
      response: {command_error: "ERROR", query_error: "ERROR"}
    dialogues:
      - q: "*IDN?"
        r: "Mock Instruments,MockLogger300,LOGGER300HUMID,2.0"
      - q: "*RST"
      - q: "MEAS:TEMP? A"
        r: "+38.75"
      - q: "MEAS:HUM? A"
        r: "88.40"
    properties:
      channel:
        default: "B"
        getter: {q: "SENS:CHAN?", r: "{:s}"}
        setter: {q: "SENS:CHAN {:s}"}
        specs: {type: str, valid: ["A", "B"]}
  MockLoad10:
    eom:
      GPIB INSTR: {q: "\n", r: "\n"}
    error:
      response: {command_error: "ERROR", query_error: "ERROR"}
    dialogues:
      - q: "*IDN?"
        r: "Other Vendor,MockLoad10,LOAD10003,3.0"

resources:
  USB::0x9999::0x0300::LOGGER300HUMID::INSTR: {device: MockLogger300}
  GPIB::3::INSTR: {device: MockLoad10}
